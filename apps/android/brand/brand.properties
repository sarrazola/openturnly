# The identity this build is compiled with.
#
# Copy this file when publishing your own app and replace every value: the
# example identifiers below belong to nobody and a store rejects them. Nothing in
# this repository points at a hosted service; a publisher that runs one fills in
# the BRAND_HOSTED_* values and the sign-in screen offers it as a choice.
#
# Addresses carry no scheme; the app prepends https:// to every one of them.

BRAND_PRODUCT_NAME=OpenTurnly
BRAND_APPLICATION_ID=com.example.openturnly
BRAND_URL_SCHEME=openturnly
MARKETING_VERSION=0.1.0
CURRENT_PROJECT_VERSION=1

# Six hex digits, no leading "#": the app's accent colour, from the sign-in
# screen to every signed-in screen, in light and dark themes.
BRAND_PRIMARY_COLOR=0f766e

# Pre-fills the server field. Host, optional port and path, no scheme.
BRAND_DEFAULT_SERVER=

# A preset for a service the publisher runs. Both values empty means the app
# only asks for a server address, which is what a self-hosted install wants.
# The label names the service on the sign-in screen. The template must contain
# {workspace}, e.g. {workspace}.example.com
BRAND_HOSTED_LABEL=
BRAND_HOSTED_SERVER_TEMPLATE=
# A directory the service runs so people sign in with an e-mail alone: the app
# POSTs {email, password} there and receives the accounts it opens, each with
# its own server. Host and path, no scheme.
BRAND_HOSTED_SIGN_IN=

# Shown on the sign-in screen and under "More" when present. Host and path, no scheme.
BRAND_PRIVACY_POLICY_URL_EN=
BRAND_PRIVACY_POLICY_URL_ES=
BRAND_SUPPORT_URL_EN=
BRAND_SUPPORT_URL_ES=

# Push notifications through Firebase Cloud Messaging: the four values of the
# Android app in your Firebase project, as its google-services.json lists them
# (project_id, mobilesdk_app_id, current_key and project_number). All of them
# empty, or any missing, means this build has no push: it never starts Firebase
# and never asks for notification permission. The in-app notifications still work.
BRAND_FIREBASE_PROJECT_ID=
BRAND_FIREBASE_APPLICATION_ID=
BRAND_FIREBASE_API_KEY=
BRAND_FIREBASE_SENDER_ID=
